{{define "title"}}Admin — Clases{{end}}

{{define "styles"}}
<style>
    .admin-header {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        padding: 3rem 2rem 2.5rem;
        border-bottom: 2px solid rgba(88,130,248,0.4);
        position: relative;
        overflow: hidden;
    }
    .admin-header::before {
        content: '';
        position: absolute;
        top: -50%; right: -10%;
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(88,130,248,0.06) 0%, transparent 70%);
    }
    .admin-breadcrumb {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: rgba(229,228,226,0.4);
        margin-bottom: 1.5rem;
        position: relative;
    }
    .admin-breadcrumb a {
        color: rgba(229,228,226,0.4);
        text-decoration: none;
        transition: color 0.2s;
    }
    .admin-breadcrumb a:hover { color: var(--color-primario); }
    .admin-breadcrumb .sep { color: rgba(229,228,226,0.2); }
    .admin-breadcrumb .current { color: #5882f8; }

    .admin-header-content {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        position: relative;
        max-width: 1100px;
        margin: 0 auto;
    }
    .admin-header-icon {
        width: 56px; height: 56px;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, rgba(88,130,248,0.25), rgba(88,130,248,0.05));
        border: 1px solid rgba(88,130,248,0.3);
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem; color: #5882f8;
        flex-shrink: 0;
    }
    .admin-header h1 {
        font-size: 2rem;
        font-weight: 900;
        color: #fff;
        margin: 0 0 0.25rem;
        letter-spacing: -0.02em;
    }
    .admin-header p {
        color: rgba(229,228,226,0.5);
        font-size: 0.9rem;
        margin: 0;
    }

    .admin-layout {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 2rem;
        max-width: 1100px;
        margin: 2.5rem auto;
        padding: 0 2rem;
        align-items: start;
    }
    @media (max-width: 900px) {
        .admin-layout { grid-template-columns: 1fr; }
    }

    /* === PANEL FORMULARIO === */
    .admin-form-panel {
        background: #111;
        border: 1px solid rgba(229,228,226,0.08);
        border-radius: 1rem;
        overflow: hidden;
        position: sticky;
        top: 1.5rem;
    }
    .admin-form-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(229,228,226,0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .admin-form-header h3 {
        font-size: 0.9rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }
    .admin-form-header h3 i { color: #5882f8; }
    #btnCancelar {
        background: transparent;
        border: 1px solid rgba(229,228,226,0.15);
        color: rgba(229,228,226,0.5);
        padding: 0.3rem 0.8rem;
        border-radius: 0.4rem;
        font-size: 0.78rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    #btnCancelar:hover { border-color: #f87171; color: #f87171; }

    .admin-form-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(229,228,226,0.5);
    }
    .form-group input, .form-group textarea, .form-group select {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(229,228,226,0.1);
        border-radius: 0.5rem;
        padding: 0.65rem 0.9rem;
        color: #fff;
        font-size: 0.9rem;
        font-family: inherit;
        transition: border-color 0.2s, background 0.2s;
        width: 100%;
        box-sizing: border-box;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
        outline: none;
        border-color: #5882f8;
        background: rgba(88,130,248,0.05);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    #btnGuardar {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #5882f8, #7c9fff);
        border: none;
        border-radius: 0.5rem;
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.03em;
        transition: filter 0.2s, transform 0.2s;
        margin-top: 0.5rem;
    }
    #btnGuardar:hover { filter: brightness(1.1); transform: translateY(-1px); }

    #formMessage {
        border-radius: 0.5rem;
        overflow: hidden;
        font-size: 0.85rem;
    }
    .msg-success {
        background: rgba(74,222,128,0.1);
        border: 1px solid rgba(74,222,128,0.3);
        color: #4ade80;
        padding: 0.75rem 1rem;
    }
    .msg-danger {
        background: rgba(248,113,113,0.1);
        border: 1px solid rgba(248,113,113,0.3);
        color: #f87171;
        padding: 0.75rem 1rem;
    }

    /* === PANEL LISTA === */
    .admin-list-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .admin-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .admin-list-header h3 {
        font-size: 0.85rem;
        font-weight: 700;
        color: rgba(229,228,226,0.5);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 0;
    }
    .count-badge {
        font-size: 0.75rem;
        background: rgba(88,130,248,0.15);
        color: #5882f8;
        border: 1px solid rgba(88,130,248,0.25);
        padding: 0.2rem 0.6rem;
        border-radius: 1rem;
        font-weight: 700;
    }

    .clase-item {
        background: #111;
        border: 1px solid rgba(229,228,226,0.07);
        border-radius: 0.75rem;
        padding: 1.25rem 1.5rem;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        transition: border-color 0.2s, background 0.2s;
    }
    .clase-item:hover {
        border-color: rgba(88,130,248,0.2);
        background: rgba(88,130,248,0.03);
    }
    .clase-item-info { flex: 1; min-width: 0; }
    .clase-item-title {
        font-weight: 700;
        color: #fff;
        font-size: 1rem;
        margin: 0 0 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .clase-item-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        font-size: 0.78rem;
        color: rgba(229,228,226,0.45);
    }
    .clase-item-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .clase-item-meta i { color: #5882f8; }

    .clase-item-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-edit, .btn-delete {
        width: 34px; height: 34px;
        border-radius: 0.4rem;
        border: 1px solid;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
        background: transparent;
        font-family: inherit;
    }
    .btn-edit { border-color: rgba(88,130,248,0.3); color: #5882f8; }
    .btn-edit:hover { background: rgba(88,130,248,0.15); border-color: #5882f8; }
    .btn-delete { border-color: rgba(248,113,113,0.3); color: #f87171; }
    .btn-delete:hover { background: rgba(248,113,113,0.15); border-color: #f87171; }

    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: rgba(229,228,226,0.3);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .empty-state p { font-size: 0.9rem; margin: 0; }

    .loading-state {
        text-align: center;
        padding: 3rem;
        color: rgba(229,228,226,0.3);
        font-size: 0.9rem;
    }
    .loading-state i { margin-right: 0.5rem; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
{{end}}

{{define "content"}}
<div class="admin-header">
    <div class="admin-header-content">
        <div>
            <div class="admin-breadcrumb">
                <a href="/admin"><i class="fas fa-shield-alt"></i> Admin</a>
                <span class="sep">/</span>
                <span class="current">Clases</span>
            </div>
            <div style="display:flex; align-items:center; gap:1.5rem;">
                <div class="admin-header-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div>
                    <h1>Clases Dirigidas</h1>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="admin-layout">
    <!-- Panel Formulario -->
    <div class="admin-form-panel">
        <div class="admin-form-header">
            <h3><i class="fas fa-plus-circle"></i> <span id="formTitle">Nueva Clase</span></h3>
            <button type="button" id="btnCancelar" class="hidden">✕ Cancelar</button>
        </div>
        <div class="admin-form-body">
            <form id="claseForm">
                <input type="hidden" id="claseId">
                <div class="form-group">
                    <label for="nombre">Nombre de la clase</label>
                    <input type="text" id="nombre" placeholder="Ej: Ciclo Indoor" required>
                </div>
                <div class="form-group">
                    <label for="entrenador">Entrenador</label>
                    <input type="text" id="entrenador" placeholder="Ej: Carlos Méndez" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label for="aforo">Aforo máx.</label>
                        <input type="number" id="aforo" placeholder="20" required>
                    </div>
                    <div class="form-group">
                        <label for="lugar">Sala / Lugar</label>
                        <input type="text" id="lugar" placeholder="Sala A" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="horario">Horario</label>
                    <input type="text" id="horario" placeholder="Lunes a las 18:00h" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" placeholder="Breve descripción de la clase..." required></textarea>
                </div>
                <div id="formMessage"></div>
                <button type="submit" id="btnGuardar">
                    <i class="fas fa-save"></i> Guardar Clase
                </button>
            </form>
        </div>
    </div>

    <!-- Panel Lista -->
    <div class="admin-list-panel">
        <div class="admin-list-header">
            <h3>Clases registradas</h3>
            <span class="count-badge" id="countBadge">—</span>
        </div>
        <div id="clasesList">
            <div class="loading-state"><i class="fas fa-circle-notch"></i> Cargando clases...</div>
        </div>
    </div>
</div>

<!-- Template para una clase -->
<template id="claseTemplate">
    <div class="clase-item">
        <div class="clase-item-info">
            <p class="clase-item-title clase-nombre"></p>
            <div class="clase-item-meta">
                <span><i class="fas fa-user"></i> <span class="clase-entrenador"></span></span>
                <span><i class="fas fa-clock"></i> <span class="clase-horario"></span></span>
                <span><i class="fas fa-users"></i> <span class="clase-aforo"></span> plazas</span>
                <span><i class="fas fa-map-marker-alt"></i> <span class="clase-lugar"></span></span>
            </div>
        </div>
        <div class="clase-item-actions">
            <button class="btn-edit btn-editar" title="Editar"><i class="fas fa-pen"></i></button>
            <button class="btn-delete btn-eliminar" title="Eliminar"><i class="fas fa-trash"></i></button>
        </div>
    </div>
</template>

<script src="/js/api_clases.js"></script>
{{end}}
