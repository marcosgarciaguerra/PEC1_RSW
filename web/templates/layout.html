<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum Gym | {{.Title}}</title>
    <link rel="icon" type="image/png" href="/img/logo_platinium.png">
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,800;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {{block "styles" .}}{{end}}
    <style>
    #cookie-consent {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90%;
        background: var(--color-secundario);
        color: var(--color-texto);
        padding: 1.5rem;
        text-align: center;
        border: 1px solid var(--color-borde);
        border-radius: 0;
        box-shadow: var(--shadow-dark);
        z-index: 1000;
        font-family: var(--fuente-principal);
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .cookie-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }
    #cookie-consent button {
        background: transparent;
        color: var(--color-plata);
        border: 1px solid var(--color-borde);
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        border-radius: 0;
        text-transform: uppercase;
        cursor: pointer;
        transition: all var(--transition-normal);
        font-family: var(--fuente-principal);
    }
    #cookie-consent button#accept-cookies {
        background: var(--color-primario);
        color: white;
        border-color: var(--color-primario);
    }
    #cookie-consent button#accept-cookies:hover {
        filter: brightness(1.2);
    }
    #cookie-consent button#reject-cookies:hover {
        background: rgba(229, 228, 226, 0.05);
    }
    </style>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    
        <div class="aplicacion">
        <div id="cookie-consent" class="hidden">
            <span>Este sitio usa cookies para mejorar tu experiencia. ¿Aceptas?</span>
            <div class="cookie-buttons">
                <button id="accept-cookies">Aceptar</button>
                <button id="reject-cookies">Rechazar</button>
            </div>
        </div>
        {{ template "navbar" . }}

        <main class="contenido-principal" id="contenido">
            {{ template "content" . }}
        </main>

        {{ template "footer" . }}
    </div>

    {{block "scripts" .}}{{end}}
    <script>
    (function(){
        function getCookie(name){
            const v = document.cookie.match('(^|;) ?'+name+'=([^;]*)(;|$)');
            return v ? decodeURIComponent(v[2]) : null;
        }
        function setCookie(name, value, days){
            const d = new Date();
            d.setTime(d.getTime() + (days*24*60*60*1000));
            document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
        }
        const consentDiv = document.getElementById('cookie-consent');
        if (!consentDiv) return;
        
        const consent = getCookie('cookie_consent');
        if (consent) {
            consentDiv.classList.add('hidden');
            consentDiv.classList.remove('cookie-consent--visible');
            if (consent === 'no') {
                document.cookie = "tracking_cookie=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
            return;
        }

        consentDiv.classList.remove('hidden');
        consentDiv.classList.add('cookie-consent--visible');

        document.getElementById('accept-cookies').addEventListener('click', function(){
            setCookie('cookie_consent', 'yes', 365);
            setCookie('tracking_cookie', 'active', 365);
            consentDiv.classList.add('hidden');
            consentDiv.classList.remove('cookie-consent--visible');
        });

        document.getElementById('reject-cookies').addEventListener('click', function(){
            setCookie('cookie_consent', 'no', 365);
            document.cookie = "tracking_cookie=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            consentDiv.classList.add('hidden');
            consentDiv.classList.remove('cookie-consent--visible');
        });
    })();
    </script>
</body>
</html>
